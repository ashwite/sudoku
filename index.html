<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="Denken statt scrollen. Sudoku mit drei Schwierigkeitsstufen und automatischem Spielstand.">
  <title>Sudoku · Denken statt scrollen</title>

  <!-- Gespeicherte Farben vor dem Laden anzeigen: verhindert ein kurzes Aufblitzen. -->
  <script>
    try {
      document.documentElement.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de';
      document.documentElement.dataset.palette = localStorage.getItem('sudoku-palette') || 'mono';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      // Die Seite funktioniert auch, wenn der Browser das Speichern blockiert.
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Kopfzeile: Logo links, Schriftzug mittig, Einstellungen rechts. -->
  <header>
    <a class="brand" href="./" data-label="home" aria-label="Sudoku Startseite">
      <span class="brand-icon">
        <img class="logo-light" src="assets/logo-light.png" alt="Hannah">
        <img class="logo-dark" src="assets/logo-dark.png" alt="Hannah">
      </span>
      <span class="brand-wordmark">sudoku</span>
    </a>

    <div class="header-actions">
      <button id="menu-toggle" class="menu-toggle" aria-label="Menü öffnen"
        aria-expanded="false" aria-controls="navigation">
        <span></span>
        <span></span>
      </button>

      <nav id="navigation" class="navigation" data-label="settings" aria-label="Spieleinstellungen" hidden>
        <div class="nav-group">
          <span class="nav-label" data-text="appearance">Darstellung</span>
          <button id="theme" class="theme-toggle" aria-label="Dunkelmodus einschalten" aria-pressed="false">
            ◐ <span>Dunkel</span>
          </button>
        </div>
        <div class="nav-group">
          <span class="nav-label" data-text="language">Sprache</span>
          <div class="languages" role="group" data-label="language" aria-label="Sprache">
            <button data-language="de" lang="de">Deutsch</button>
            <button data-language="en" lang="en">English</button>
          </div>
        </div>
        <div class="nav-group">
          <span class="nav-label" data-text="colors">Farbtheme</span>
          <!-- Die Farbpunkte werden aus der Liste in app.js erstellt. -->
          <div id="palettes" class="palettes" data-label="colors" aria-label="Farbtheme"></div>
        </div>

        <div class="nav-group">
          <span class="nav-label" data-text="difficulty">Schwierigkeit</span>
          <div class="levels" data-label="difficulty" aria-label="Schwierigkeitsgrad">
            <button data-text="easy" data-level="easy">Leicht</button>
            <button data-text="medium" data-level="medium">Mittel</button>
            <button data-text="hard" data-level="hard">Schwer</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1 data-text="headline">Denken statt scrollen.</h1>
    </section>
    <section class="game" data-label="game" aria-label="Sudoku-Spiel">
      <!-- JavaScript ergänzt hier die 81 Felder und die neun Zahlentasten. -->
      <div class="board-wrap">
        <div id="board" role="group" data-label="board" aria-label="Sudoku-Raster"></div>
      </div>
      <div id="numbers" data-label="numbers" aria-label="Zahlen eingeben"></div>
      <!-- Meldungen sind hörbar für Screenreader, aber nicht sichtbar. -->
      <p id="message" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
